<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo - ONG Pancinha Feliz da Lili</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body class="body-login">

  <div class="login-container">
    <div class="login-card">
      
      <div class="login-header">
        <div class="login-icones">🐶🐱</div>
        <h2>🔒 Acesso Restrito</h2>
        <p>Painel Administrativo - ONG Pancinha Feliz da Lili</p>
      </div>

      <!-- Alerta de erro de autenticação -->
      <div id="mensagem-erro" class="alerta-erro" style="display: none;">
        Usuário ou senha incorretos!
      </div>

      <form id="form-login" onsubmit="efetuarLogin(event)">
        <div class="campo-login">
          <label for="usuario"><strong>Usuário:</strong></label>
          <input type="text" id="usuario" required placeholder="Digite o usuário de acesso">
        </div>

        <div class="campo-login">
          <label for="senha"><strong>Senha:</strong></label>
          <input type="password" id="senha" required placeholder="Digite a sua senha">
        </div>

        <button type="submit" class="btn-login-submit">
          Entrar no Painel
        </button>
      </form>

      <div class="login-footer">
        <a href="index.html" class="link-voltar-login">← Voltar para a Vitrine Pública</a>
      </div>

    </div>
  </div>

  <script src="login.js"></script>
</body>

</html>
