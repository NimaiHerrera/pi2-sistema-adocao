<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adoção de Pets - ONG Parceira</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="container">
      <h1 id="ong-nome">Carregando ONG...</h1>
      <p id="ong-descricao"></p>
    </div>
  </header>

  <main class="container">
    <section class="vitrine-header">
      <h2>Animais Disponíveis para Adoção</h2>
      <div class="filtros">
        <button onclick="carregarAnimais()">Todos</button>
        <button onclick="carregarAnimais('Cão')">Cães</button>
        <button onclick="carregarAnimais('Gato')">Gatos</button>
      </div>
    </section>

    <!-- O JavaScript vai preencher os cards dentro dessa div -->
    <section id="lista-animais" class="grid-animais">
      <p>Carregando pets...</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
